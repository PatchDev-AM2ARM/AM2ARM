# GitHub Actions workflow for the public repo (place at .github/workflows/).
# Builds the Windows one-file exe of the patcher with PyInstaller.
# Trigger manually, then attach dist/AM2R-Android-Patcher.exe to the release
# alongside patch-data/ and the vendor/ folder.
name: build-windows-patcher
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name AM2R-Android-Patcher
          am2r_android_patcher.py
        working-directory: android-autopatcher
      - uses: actions/upload-artifact@v4
        with:
          name: AM2R-Android-Patcher
          path: android-autopatcher/dist/AM2R-Android-Patcher.exe
